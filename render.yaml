# Render Blueprint for the factory dashboard.
# Build context is rooted at dashboard/ (dockerContext + dockerfilePath).
# Postgres is created MANUALLY on Render (per build ticket 01) — no databases: block here.
services:
  - type: web
    name: factory-dashboard
    runtime: docker
    plan: starter
    dockerContext: dashboard
    dockerfilePath: dashboard/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      # Set manually to the connection string of the manually-created Postgres.
      - key: ConnectionStrings__Runs
        sync: false
      # Shared secret for the ingest endpoint (used in a later ticket).
      - key: FACTORY_TOKEN
        sync: false
